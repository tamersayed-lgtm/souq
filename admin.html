<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة إدارة سوق بلدنا</title>
<style>
:root{--green:#174c3a;--green2:#216b4c;--bg:#f5f7f3;--line:#e4e9e2;--muted:#5f6d63}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1c2a22;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;font-size:14px}
button{font:inherit;cursor:pointer}.wrap{max-width:720px;margin:auto;padding-bottom:30px}
header{background:var(--green);color:#fff;padding:16px;border-radius:0 0 20px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:18px;margin:0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;min-height:44px}
.refresh{background:#ffffff22;color:#fff}.ok{background:var(--green2);color:#fff}.no{background:#fff;color:#8d3434;border:1px solid #e5c7c7}.gray{background:#fff;color:var(--green);border:1px solid #d5e1d6}
.tabs{display:flex;gap:8px;padding:14px;overflow-x:auto}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:10px 14px;min-height:44px}
.tab.on{background:var(--green2);color:#fff;border-color:var(--green2);font-weight:800}
.list{padding:0 14px;display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}
.imgs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.imgs img{width:92px;height:92px;object-fit:cover;border-radius:10px;flex:0 0 92px}
.card h3{margin:0 0 6px;font-size:16px}.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;gap:10px}
.desc{white-space:pre-line;color:#33433a;margin:8px 0;overflow-wrap:anywhere}.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{flex:1}
.empty{text-align:center;color:var(--muted);padding:40px 10px}.note{font-size:12px;color:var(--muted);padding:12px 14px}
.tag{display:inline-block;background:#fff3cf;color:#8a6500;border-radius:6px;padding:2px 8px;font-size:12px;margin-inline-start:6px}

.modes{display:flex;gap:8px;padding:14px 14px 0}.mode{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;min-height:44px;font-weight:700}.mode.on{background:var(--green);color:#fff;border-color:var(--green)}
.form{display:grid;gap:8px}.form input,.form select{width:100%;border:1px solid #d5e1d6;border-radius:10px;padding:10px;min-height:44px;font:inherit;background:#fff}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts.small .btn{min-height:40px;padding:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🛡️ لوحة إدارة سوق بلدنا</h1><button class="btn refresh" id="out" type="button" hidden>خروج</button></header>
<div id="gate" class="list" style="padding-top:14px"></div>
<div id="app" hidden><div class="modes" id="modes"></div><div class="tabs" id="tabs"></div><div class="list" id="list"></div></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getDatabase,ref,onValue,get,update,set} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyCuqWu06ISjD4bL6BqeGjwVYpCEmaY_OGU",authDomain:"souq-albalad-537ca.firebaseapp.com",databaseURL:"https://souq-albalad-537ca-default-rtdb.firebaseio.com",projectId:"souq-albalad-537ca",storageBucket:"souq-albalad-537ca.firebasestorage.app",messagingSenderId:"849847373975",appId:"1:849847373975:web:f272750e1d4b06b172d9d2"}),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n)===0?'مجانًا':Number(n).toLocaleString('ar-EG')+' ج.م';
const norm=p=>String(p||'').replace(/\D/g,'').slice(-10);
const TABS=[['pending','قيد المراجعة'],['approved','المعتمدة'],['rejected','المرفوضة']],MODES=[['ads','الإعلانات'],['banners','البنر'],['blocked','المحظورون'],['reports','البلاغات']];
let ads=[],banners=[],blocked={},reps=[],full={},mode='ads',tab='pending',started=false;
const arr=sn=>{const v=sn.val()||{};return Object.keys(v).map(k=>({...v[k],id:Number(k),key:k}))};
function gate(html){$('gate').innerHTML=html;$('gate').hidden=false;$('app').hidden=true}
function loginForm(msg){gate(`<article class="card"><h3>تسجيل دخول الأدمن</h3>${msg?`<p class="desc">${msg}</p>`:''}<div class="form"><input id="em" type="email" placeholder="الإيميل"><input id="pw" type="password" placeholder="الباسورد"><button class="btn ok" id="go" type="button">دخول</button></div></article>`);$('go').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(e){loginForm('الإيميل أو الباسورد غير صحيح')}}}
onAuthStateChanged(auth,async u=>{$('out').hidden=!u;if(!u){started=false;return loginForm()}let ok=false;try{ok=(await get(ref(db,'admins/'+u.uid))).val()===true}catch(e){}if(!ok)return gate(`<article class="card"><h3>هذا الحساب ليس أدمن</h3><p class="desc">أضف هذا الـ UID في Firebase Console تحت <b>admins</b> بقيمة <b>true</b> ثم حدّث الصفحة:</p><p class="desc" style="direction:ltr;user-select:all"><b>${esc(u.uid)}</b></p></article>`);$('gate').hidden=true;$('app').hidden=false;if(!started){started=true;onValue(ref(db,'ads'),sn=>{ads=arr(sn).sort((a,b)=>b.id-a.id);render()});onValue(ref(db,'banners'),sn=>{banners=arr(sn).sort((a,b)=>(a.order||0)-(b.order||0));render()});onValue(ref(db,'blocked'),sn=>{blocked=sn.val()||{};render()});onValue(ref(db,'reports'),sn=>{reps=arr(sn).sort((x,y)=>y.createdAt-x.createdAt);render()})}});
$('out').onclick=()=>signOut(auth);
const up=(p)=>update(ref(db),p);
function btns(p){const bn=!!blocked[p.ownerUid];const c=p.status==='pending'?`<button class="btn ok" data-s="approved" data-id="${p.id}">موافقة</button><button class="btn no" data-s="rejected" data-id="${p.id}">رفض</button>`:p.status==='approved'?`<button class="btn gray" data-s="rejected" data-id="${p.id}">إيقاف</button>`:`<button class="btn gray" data-s="pending" data-id="${p.id}">إعادة للمراجعة</button>`;return `<div class="acts small">${c}<button class="btn no" data-del="${p.id}">حذف</button></div><div class="acts small">${bn?'<span class="tag">البائع محظور</span>':`<button class="btn no" data-ban="${p.id}">🚫 حظر البائع</button>`}${p.imgCount>1&&!full[p.id]?`<button class="btn gray" data-imgs="${p.id}">كل الصور (${p.imgCount})</button>`:''}</div>`}
function viewAds(){$('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" data-tab="${k}" type="button">${l} (${ads.filter(p=>p.status===k).length})</button>`).join('');const list=ads.filter(p=>p.status===tab);$('list').innerHTML=list.length?list.map(p=>{const im=full[p.id]||p.images||[];return `<article class="card">${im.length?`<div class="imgs">${im.map(src=>`<img src="${esc(src)}" alt="">`).join('')}</div>`:''}<h3>${esc(p.name)}${p.sold?'<span class="tag">تم البيع</span>':''}</h3><div class="row"><span>السعر</span><b>${money(p.price)}</b></div><div class="row"><span>القسم</span><b>${esc(p.category)}${p.kind==='عقار'?' · '+esc(p.deal||''):''}</b></div><div class="row"><span>البائع</span><b>${esc(p.seller)}</b></div><div class="row"><span>الموبايل</span><a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></div><p class="desc">${esc(p.description||'لا يوجد وصف.')}</p>${btns(p)}</article>`}).join(''):'<div class="empty">لا توجد إعلانات في هذا القسم.</div>'}
function viewBanners(){$('tabs').innerHTML='';$('list').innerHTML=`<article class="card"><h3>إضافة بنر</h3><div class="form"><div class="two"><input id="bBadge" maxlength="25" placeholder="الوسم (مثال: 🍞 مخبز)"><input id="bIcon" maxlength="4" placeholder="أيقونة 🍞"></div><input id="bTitle" maxlength="45" placeholder="العنوان *"><input id="bText" maxlength="90" placeholder="نص قصير"><div class="two"><select id="bColor"><option value="green">أخضر</option><option value="featured">أخضر وذهبي</option><option value="gold">ذهبي</option><option value="blue">أزرق</option></select><input id="bCta" maxlength="22" placeholder="نص الزر (اختياري)"></div><input id="bLink" placeholder="رابط الزر: https://… أو tel:… أو رقم موبايل"><button class="btn ok" data-addb="1" type="button">إضافة البنر</button></div></article>`+(banners.length?banners.map((b,i)=>`<article class="card"><h3>${esc(b.icon||'📣')} ${esc(b.title)}</h3><div class="row"><span>الوسم</span><b>${esc(b.badge||'-')}</b></div><p class="desc">${esc(b.text||'')}</p><div class="acts small">${i?`<button class="btn gray" data-bup="${b.id}">↑ تقديم</button>`:''}<button class="btn no" data-bdel="${b.id}">حذف</button></div></article>`).join(''):'<div class="empty">لا توجد بنرات؛ التطبيق يعرض البنرات الافتراضية.</div>')+'<p class="note">يظهر التعديل للمستخدمين عند فتح التطبيق من جديد.</p>'}
function viewBlocked(){$('tabs').innerHTML='';const k=Object.keys(blocked);$('list').innerHTML=k.length?k.map(u=>`<article class="card"><h3>${esc(blocked[u].name||'بدون اسم')}</h3><div class="row"><span>UID</span><b style="direction:ltr;overflow-wrap:anywhere">${esc(u)}</b></div><div class="acts small"><button class="btn gray" data-unban="${esc(u)}">رفع الحظر</button></div></article>`).join(''):'<div class="empty">لا يوجد مستخدمون محظورون.</div>'}
function viewReports(){$('tabs').innerHTML='';const grp={};reps.forEach(r=>{(grp[r.adId]=grp[r.adId]||[]).push(r)});const ids=Object.keys(grp);$('list').innerHTML=ids.length?ids.map(id=>{const rs=grp[id],ad=ads.find(x=>String(x.id)===id);return `<article class="card"><h3>${esc(rs[0].adName||'إعلان')}${ad?'':'<span class="tag">محذوف</span>'}</h3><div class="row"><span>عدد البلاغات</span><b>${rs.length}</b></div>${rs.slice(0,5).map(r=>`<p class="desc">• ${esc(r.reason)}${r.note?' — '+esc(r.note):''}</p>`).join('')}<div class="acts small">${ad&&ad.status==='approved'?`<button class="btn gray" data-rstop="${id}">إيقاف الإعلان</button>`:''}${ad?`<button class="btn no" data-rdel="${id}">حذف الإعلان</button>`:''}<button class="btn gray" data-rok="${id}">تجاهل البلاغات</button></div></article>`}).join(''):'<div class="empty">لا توجد بلاغات.</div>'}
function render(){if($('app').hidden)return;if(mode==='banners'&&document.activeElement&&document.activeElement.closest('.form'))return;$('modes').innerHTML=MODES.map(([k,l])=>`<button class="mode ${k===mode?'on':''}" data-mode="${k}" type="button">${l}${k==='reports'&&reps.length?' ('+reps.length+')':''}</button>`).join('');({ads:viewAds,banners:viewBanners,blocked:viewBlocked,reports:viewReports})[mode]()}
function cleanLink(v){v=v.trim();if(!v)return '';if(/^(https:\/\/|tel:)/.test(v))return v;if(/^\+?[\d\s-]{10,16}$/.test(v))return 'https://wa.me/20'+norm(v);return null}
document.addEventListener('click',async e=>{const g=k=>e.target.closest('['+k+']');let t;try{
if(t=g('data-mode')){mode=t.dataset.mode;render();return}
if(t=g('data-tab')){tab=t.dataset.tab;render();return}
if(t=g('data-s')){const id=t.dataset.id,s=t.dataset.s;await update(ref(db,'ads/'+id),{status:s,time:s==='approved'?'حديثًا':s==='pending'?'بانتظار المراجعة':'مرفوض'});return}
if(t=g('data-del')){if(!confirm('حذف هذا الإعلان وصوره نهائيًا؟'))return;await up({['ads/'+t.dataset.del]:null,['adImages/'+t.dataset.del]:null});return}
if(t=g('data-imgs')){const sn=await get(ref(db,'adImages/'+t.dataset.imgs));const v=sn.val();if(v)full[t.dataset.imgs]=Array.isArray(v)?v:Object.values(v);render();return}
if(t=g('data-ban')){const p=ads.find(x=>x.id===Number(t.dataset.ban));if(!p||!confirm('حظر '+p.seller+' ورفض كل إعلاناته؟'))return;const u={['blocked/'+p.ownerUid]:{name:p.seller,at:Date.now()}};ads.filter(x=>x.ownerUid===p.ownerUid&&x.status!=='rejected').forEach(x=>{u['ads/'+x.id+'/status']='rejected'});await up(u);return}
if(t=g('data-rstop')||g('data-rdel')||g('data-rok')){const id=(t.dataset.rstop||t.dataset.rdel||t.dataset.rok),u={};reps.filter(r=>r.adId===id).forEach(r=>{u['reports/'+r.key]=null});if(t.dataset.rdel){if(!confirm('حذف الإعلان وصوره نهائيًا؟'))return;u['ads/'+id]=null;u['adImages/'+id]=null}if(t.dataset.rstop){u['ads/'+id+'/status']='rejected';u['ads/'+id+'/time']='مرفوض'}await up(u);return}
if(t=g('data-unban')){await up({['blocked/'+t.dataset.unban]:null});return}
if(g('data-addb')){const v=id=>$(id).value.trim();if(!v('bTitle')){alert('اكتب عنوان البنر');return}const link=cleanLink($('bLink').value);if(link===null){alert('الرابط غير صحيح. استخدم https://… أو tel:… أو رقم موبايل.');return}const id=Date.now();await set(ref(db,'banners/'+id),{order:id,badge:v('bBadge'),icon:v('bIcon'),title:v('bTitle'),text:v('bText'),color:$('bColor').value,cta:v('bCta'),link});document.activeElement.blur();render();return}
if(t=g('data-bdel')){if(!confirm('حذف البنر؟'))return;await up({['banners/'+t.dataset.bdel]:null});return}
if(t=g('data-bup')){const i=banners.findIndex(b=>b.id===Number(t.dataset.bup));if(i>0)await up({['banners/'+banners[i].id+'/order']:banners[i-1].order,['banners/'+banners[i-1].id+'/order']:banners[i].order})}
}catch(err){alert('تعذر تنفيذ العملية: '+(err&&err.message||err))}});
</script>
</body>
</html>
