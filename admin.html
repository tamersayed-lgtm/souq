<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة إدارة سوق بلدنا</title>
<style>
:root{--green:#174c3a;--green2:#216b4c;--bg:#f5f7f3;--line:#e4e9e2;--muted:#5f6d63}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1c2a22;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,Arial,sans-serif;font-size:14px}
button{font:inherit;cursor:pointer}.wrap{max-width:720px;margin:auto;padding-bottom:30px}
header{background:var(--green);color:#fff;padding:16px;border-radius:0 0 20px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:18px;margin:0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;min-height:44px}
.refresh{background:#ffffff22;color:#fff}.ok{background:var(--green2);color:#fff}.no{background:#fff;color:#8d3434;border:1px solid #e5c7c7}.gray{background:#fff;color:var(--green);border:1px solid #d5e1d6}
.tabs{display:flex;gap:8px;padding:14px;overflow-x:auto}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:10px 14px;min-height:44px}
.tab.on{background:var(--green2);color:#fff;border-color:var(--green2);font-weight:800}
.list{padding:0 14px;display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}
.imgs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.imgs img{width:92px;height:92px;object-fit:cover;border-radius:10px;flex:0 0 92px}
.card h3{margin:0 0 6px;font-size:16px}.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;gap:10px}
.desc{white-space:pre-line;color:#33433a;margin:8px 0;overflow-wrap:anywhere}.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{flex:1}
.empty{text-align:center;color:var(--muted);padding:40px 10px}.note{font-size:12px;color:var(--muted);padding:12px 14px}
.tag{display:inline-block;background:#fff3cf;color:#8a6500;border-radius:6px;padding:2px 8px;font-size:12px;margin-inline-start:6px}

.modes{display:flex;gap:8px;padding:14px 14px 0}.mode{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;min-height:44px;font-weight:700}.mode.on{background:var(--green);color:#fff;border-color:var(--green)}
.form{display:grid;gap:8px}.form input,.form select{width:100%;border:1px solid #d5e1d6;border-radius:10px;padding:10px;min-height:44px;font:inherit;background:#fff}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts.small .btn{min-height:40px;padding:8px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🛡️ لوحة إدارة سوق بلدنا</h1><button class="btn refresh" id="refresh" type="button">تحديث</button></header>
<div class="modes" id="modes"></div><div class="tabs" id="tabs"></div>
<div class="list" id="list"></div>
<p class="note">نسخة تجريبية: تقرأ بيانات تطبيق المستخدم من نفس المتصفح والموقع. الحماية الحقيقية (تسجيل دخول وصلاحيات) تتم على السيرفر لاحقًا، ولا تنشر هذه الصفحة للعامة قبل ذلك.</p>
</div>
<script>
(()=>{
const DB='SouqAlbaladDB',ST='appState',$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n)===0?'مجانًا':Number(n).toLocaleString('ar-EG')+' ج.م';
const norm=p=>String(p||'').replace(/\D/g,'').slice(-10);
const TABS=[['pending','قيد المراجعة'],['approved','المعتمدة'],['rejected','المرفوضة']];
const MODES=[['ads','الإعلانات'],['banners','البنر'],['blocked','المحظورون']];
let items=[],cfg={banners:[],blocked:[]},mode='ads',tab='pending';
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(ST))r.result.createObjectStore(ST,{keyPath:'key'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const get=(db,k)=>new Promise((res,rej)=>{const q=db.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>res(q.result?q.result.value:null);q.onerror=()=>rej(q.error)});
const rmw=(k,fn)=>open().then(db=>new Promise((res,rej)=>{const tx=db.transaction(ST,'readwrite'),st=tx.objectStore(ST),q=st.get(k);q.onsuccess=()=>{const v=fn(q.result?q.result.value:null);if(v)st.put({key:k,value:v})};tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)}));
const setStatus=(ids,status)=>rmw('main',v=>{if(!v||!v.userListings)return null;v.userListings.forEach(p=>{if(ids.includes(p.id)){p.status=status;if(status==='approved')p.time='حديثًا';if(status==='pending')p.time='بانتظار المراجعة'}});return v});
const saveCfg=fn=>rmw('admin',v=>{v=v||{};v.banners=v.banners||[];v.blocked=v.blocked||[];fn(v);return v});
function btns(p){const x=`<button class="btn no" data-s="deleted" data-id="${p.id}">حذف</button>`;const c=p.status==='pending'?`<button class="btn ok" data-s="approved" data-id="${p.id}">موافقة</button><button class="btn no" data-s="rejected" data-id="${p.id}">رفض</button>`:p.status==='approved'?`<button class="btn gray" data-s="rejected" data-id="${p.id}">إيقاف</button>`:`<button class="btn gray" data-s="pending" data-id="${p.id}">إعادة للمراجعة</button>`;const banned=cfg.blocked.some(b=>b.phone===norm(p.phone));return `<div class="acts small">${c}${x}</div><div class="acts small">${banned?'<span class="tag">البائع محظور</span>':`<button class="btn no" data-ban="${p.id}">🚫 حظر البائع</button>`}</div>`}
function viewAds(){$('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" data-tab="${k}" type="button">${l} (${items.filter(p=>p.status===k).length})</button>`).join('');const list=items.filter(p=>p.status===tab);$('list').innerHTML=list.length?list.map(p=>`<article class="card">${p.images&&p.images.length?`<div class="imgs">${p.images.map(src=>`<img src="${src}" alt="">`).join('')}</div>`:''}<h3>${esc(p.name)}${p.sold?'<span class="tag">تم البيع</span>':''}</h3><div class="row"><span>السعر</span><b>${money(p.price)}</b></div><div class="row"><span>القسم</span><b>${esc(p.category)}${p.kind==='عقار'?' · '+esc(p.deal||''):''}</b></div><div class="row"><span>البائع</span><b>${esc(p.seller)}</b></div><div class="row"><span>الموبايل</span><a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></div><p class="desc">${esc(p.description||'لا يوجد وصف.')}</p>${btns(p)}</article>`).join(''):'<div class="empty">لا توجد إعلانات في هذا القسم.</div>'}
function viewBanners(){$('tabs').innerHTML='';$('list').innerHTML=`<article class="card"><h3>إضافة بنر</h3><div class="form"><div class="two"><input id="bBadge" maxlength="25" placeholder="الوسم (مثال: 🍞 مخبز)"><input id="bIcon" maxlength="4" placeholder="أيقونة 🍞"></div><input id="bTitle" maxlength="45" placeholder="العنوان *"><input id="bText" maxlength="90" placeholder="نص قصير"><div class="two"><select id="bColor"><option value="green">أخضر</option><option value="featured">أخضر وذهبي</option><option value="gold">ذهبي</option><option value="blue">أزرق</option></select><input id="bCta" maxlength="22" placeholder="نص الزر (اختياري)"></div><input id="bLink" placeholder="رابط الزر: https://… أو tel:… أو رقم موبايل"><button class="btn ok" data-addb="1" type="button">إضافة البنر</button></div></article>`+(cfg.banners.length?cfg.banners.map((b,i)=>`<article class="card"><h3>${esc(b.icon||'📣')} ${esc(b.title)}</h3><div class="row"><span>الوسم</span><b>${esc(b.badge||'-')}</b></div><p class="desc">${esc(b.text||'')}</p><div class="acts small">${i?`<button class="btn gray" data-bup="${b.id}">↑ تقديم</button>`:''}<button class="btn no" data-bdel="${b.id}">حذف</button></div></article>`).join(''):'<div class="empty">لا توجد بنرات؛ التطبيق يعرض البنرات الافتراضية.</div>')+'<p class="note">يظهر البنر للمستخدمين عند فتح التطبيق من جديد.</p>'}
function viewBlocked(){$('tabs').innerHTML='';$('list').innerHTML=cfg.blocked.length?cfg.blocked.map(b=>`<article class="card"><h3>${esc(b.name||'بدون اسم')}</h3><div class="row"><span>الموبايل</span><b>${esc(b.phone)}</b></div><div class="acts small"><button class="btn gray" data-unban="${esc(b.phone)}">رفع الحظر</button></div></article>`).join(''):'<div class="empty">لا يوجد مستخدمون محظورون.</div>'}
function render(){$('modes').innerHTML=MODES.map(([k,l])=>`<button class="mode ${k===mode?'on':''}" data-mode="${k}" type="button">${l}</button>`).join('');({ads:viewAds,banners:viewBanners,blocked:viewBlocked})[mode]()}
async function refresh(){try{const db=await open();const m=await get(db,'main'),a=await get(db,'admin')||{};items=((m&&m.userListings)||[]).filter(p=>p.status!=='deleted');cfg={banners:a.banners||[],blocked:a.blocked||[]}}catch(e){}render()}
function cleanLink(v){v=v.trim();if(!v)return '';if(/^(https:\/\/|tel:)/.test(v))return v;if(/^\+?[\d\s-]{10,16}$/.test(v))return 'https://wa.me/20'+norm(v);return null}
document.addEventListener('click',async e=>{const g=k=>e.target.closest('['+k+']');let t;
if(t=g('data-mode')){mode=t.dataset.mode;render();return}
if(t=g('data-tab')){tab=t.dataset.tab;render();return}
if(t=g('data-s')){const id=Number(t.dataset.id);if(t.dataset.s==='deleted'&&!confirm('حذف هذا الإعلان نهائيًا من السوق؟'))return;await setStatus([id],t.dataset.s);refresh();return}
if(t=g('data-ban')){const p=items.find(x=>x.id===Number(t.dataset.ban));if(!p||!confirm('حظر '+p.seller+' ورفض كل إعلاناته؟'))return;const ph=norm(p.phone);await saveCfg(v=>{if(!v.blocked.some(b=>b.phone===ph))v.blocked.push({phone:ph,name:p.seller,at:Date.now()})});await setStatus(items.filter(x=>norm(x.phone)===ph&&x.status!=='rejected').map(x=>x.id),'rejected');refresh();return}
if(t=g('data-unban')){await saveCfg(v=>{v.blocked=v.blocked.filter(b=>b.phone!==t.dataset.unban)});refresh();return}
if(g('data-addb')){const v=id=>$(id).value.trim();if(!v('bTitle')){alert('اكتب عنوان البنر');return}const link=cleanLink($('bLink').value);if(link===null){alert('الرابط غير صحيح. استخدم https://… أو tel:… أو رقم موبايل.');return}await saveCfg(c=>{c.banners.push({id:Date.now(),badge:v('bBadge'),icon:v('bIcon'),title:v('bTitle'),text:v('bText'),color:$('bColor').value,cta:v('bCta'),link})});refresh();return}
if(t=g('data-bdel')){if(!confirm('حذف البنر؟'))return;await saveCfg(c=>{c.banners=c.banners.filter(b=>b.id!==Number(t.dataset.bdel))});refresh();return}
if(t=g('data-bup')){await saveCfg(c=>{const i=c.banners.findIndex(b=>b.id===Number(t.dataset.bup));if(i>0)[c.banners[i-1],c.banners[i]]=[c.banners[i],c.banners[i-1]]});refresh()}});
$('refresh').addEventListener('click',refresh);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&mode==='ads')refresh()});
refresh();
})();
</script>
</body>
</html>
